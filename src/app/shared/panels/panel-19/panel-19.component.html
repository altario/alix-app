<app-report-selector></app-report-selector>

<div class="box box--table">
  <div class="box__header box__header--bg">
    <div class="row-justified">
      <div class="box__title title--compound">
        <h1 class="title"># Peer Assets Last 5 Years</h1>
      </div>
    </div>
  </div>
  <div class="box__body box__body--bg">
    <div class="cell__wrapper cell__wrapper cell__wrapper--bg-dark">
      <div class="cell__wrapper__top">
        <span class="label__up label--color">{{ config.population1.populationName.value }} </span>
      </div>
      <div class="cell__wrapper__info">
        <p class="highlighted--big highlighted--color"
          [appNum]="config.population1.absPeerAssetsLuxuryLongRent5Y.value"
          [showUnit]="false"
          [unitSmall]="false">
        </p>
      </div>
    </div>
    <div class="w-100"></div>
    <div class="cell__wrapper cell__wrapper cell__wrapper--bg-light">
      <div class="cell__wrapper__top">
        <span class="label__up label--color">{{ config.population2.populationName.value }} </span>
      </div>
      <div class="cell__wrapper__info">
        <p class="highlighted--big highlighted--color"
          [appNum]="config.population2.absPeerAssetsLuxuryLongRent5Y.value"
          [showUnit]="false"
          [unitSmall]="false">
        </p>
      </div>
    </div>
    <div class="w-100"></div>
    <div class="cell__wrapper cell__wrapper cell__wrapper--bg-dark">
      <div class="cell__wrapper__top">
        <span class="label__up label--color">{{ config.population3.populationName.value }} </span>
      </div>
      <div class="cell__wrapper__info">
        <p class="highlighted--big highlighted--color"
          [appNum]="config.population3.absPeerAssetsLuxuryLongRent5Y.value"
          [showUnit]="false"
          [unitSmall]="false">
        </p>
      </div>
    </div>
  </div>
</div>
