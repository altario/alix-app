<app-report-selector></app-report-selector>

<div class="box box--table">
    <div class="box__header box__header--bg">
      <div class="d-flex flex-row justify-content-between">
        <div class="title--compound">
          <div class="main__title">
            <span class="u-strong u-uppercase">
                {{config.name}}
            </span>
          </div>
        </div>
      </div>
    </div>
    <div class="box__body box__body--bg">
      <div class=" cell__wrapper cell__wrapper--bg-dark">
        <div class="row-list--medium">
          <i class="icon--medium icol ico-home"></i>
          <div>
            <div class="cell__wrapper">
              <p class="highlighted--big highlighted--color"> {{config.rating}}
                <small class="u-uppercase highlighted__small--color">
                  {{config.total | number: '1.0-0'}} places
                </small>
              </p>
            </div>
            <div class="cell__wrapper">
              <div class="list-simple">
                <div>
                    <i class="icon--small icol ico-star"></i>
                    <i class="icon--small icol ico-star"></i>
                    <i class="icon--small icol ico-star"></i>
                    <i class="icon--small icol ico-star"></i>
                </div>
              </div>
            </div>
            <div class="cell__wrapper">
              <div class="list-simple">
                <div>
                  <span class="text--success">{{config.growth}} stars</span>
                  <span>2 years ago</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
  </div>
</div>
