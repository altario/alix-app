<app-report-selector></app-report-selector>
<div class="box box--table">
  <div class="box__header box__header--bg">
    <div class="row-justified">
      <div class="title--compound">
        <div class="main__title">AVG Demand Rate</div>
        <div class="secondary__title">
          Long Term Rental Asset
          <p>Demand Rate >> Listed time percentile. It indicates how fast an asset gets out of the market.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="box__body box__body--bg">
    <div class=" cell__wrapper cell__wrapper--bg-dark">
      <div class="highlighted--huge highlighted--color">
        {{config.demandRate.value | perc:1}}
        <small class="u-uppercase highlighted__small--color">%</small>
      </div>
      <div class="highlighted--small highlighted--color">
        <span>
          {{ config.avgDaysFromListingToUnlisting.value | number:'1.0-0' }}
        </span>
        <small>
          days average from listing to unlisting
        </small>
      </div>
      <div class="perc-bar">
        <div class="perc-bar__percentage" [style.width.%]="config.demandRate.value | perc:1">
          <div class="perc-bar__percentage__5y" style="width: 9.7%"></div>
          <div class="perc-bar__percentage__1y" style="width: 4.2%"></div>
        </div>
      </div>
    </div>
  </div>
</div>
