<div class="box box--table">

  <div class="box__body box__body--bg">

    <div class="cell__wrapper cell__wrapper cell__wrapper--bg-dark">
      <div class="cell__wrapper__top">
        <span class="label__up label--color">Total Exposure</span>
      </div>
      <div class="cell__wrapper__info">
        <p class="highlighted--big highlighted--color"
          [appNum]="config.totalExposure.value"
          [showUnit]="true"
          [unitSmall]="true"
          unitClass="u-uppercase highlighted__small--color">
        </p>
        <span class="chart-line"><img src="assets/images/line-chart.svg" /></span>
      </div>
    </div>

    <div class="cell__wrapper cell__wrapper cell__wrapper--bg-light">
      <div class="cell__wrapper__top">
        <span class="label__up label--color">ROE</span>
      </div>
      <div class="cell__wrapper__info">
        <p class="highlighted--big highlighted--color">
          {{config.roe.value | perc}}
          <small class="u-uppercase" style="color: #8D8C8D !important;">%</small>
        </p>
        <span class="chart-line"><img src="assets/images/line-chart.svg" /></span>
      </div>
    </div>

    <div class="cell__wrapper cell__wrapper cell__wrapper--bg-dark">
      <div class="cell__wrapper__top">
        <span class="label__up label--color">Expected Net Interest Margin</span>
      </div>
      <div class="cell__wrapper__info">
        <p class="highlighted--big highlighted--color"
          [appNum]="config.expectedNetInterestMargin.value"
          [showUnit]="true"
          [unitSmall]="true"
          unitClass="u-uppercase highlighted__small--color">
        </p>
        <span class="chart-line"><img src="assets/images/line-chart.svg" /></span>
      </div>
    </div>

    <div class="cell__wrapper cell__wrapper cell__wrapper--bg-light">
      <div class="cell__wrapper__top">
        <span class="label__up label--color">Expected Loss</span>
      </div>
      <div class="cell__wrapper__info">
        <p class="highlighted--big highlighted--color"
          [appNum]="config.expectedLoss.value"
          [showUnit]="true"
          [unitSmall]="true"
          unitClass="u-uppercase highlighted__small--color">
        </p>
        <span class="chart-line"><img src="assets/images/line-chart.svg" /></span>
      </div>
    </div>

    <div class="cell__wrapper cell__wrapper cell__wrapper--bg-dark">
      <div class="cell__wrapper__top">
        <span class="label__up label--color">Var</span>
      </div>
      <div class="cell__wrapper__info">
        <p class="highlighted--big highlighted--color"
          [appNum]="config.var.value"
          [showUnit]="true"
          [unitSmall]="true"
          unitClass="u-uppercase highlighted__small--color">
        </p>
        <span class="chart-line" (click)="showModalLineChart(template)"><img src="assets/images/line-chart.svg" /></span>
      </div>
    </div>

  </div>
</div>


<ng-template #template>
  <div class="modal-header">
    <h4 class="modal-title pull-left">VAR</h4>
  </div>
  <div class="modal-body">
    <alix-line *ngIf="chart.opts" [series]="chart.series" [opts]="chart.opts"></alix-line>
  </div>
</ng-template>
