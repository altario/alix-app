<div class="box restructuring-row__container">
  <div class="restructuring-row__title">{{ restructuring[0] }}</div>
  <div class="restructuring-row__position">{{ restructuring[1] }}</div>

  <div class="restructuring-row__current-exposure">
    <div class="val">{{ getValue(restructuring[2], 'value') }}</div>
    <div class="small">{{ getValue(restructuring[2], 'small') }}</div>
  </div>

  <div class="restructuring-row__expected-vs-adjusted-net-margin"
    [class.green]="restructuring[4] == 'green'"
    [class.orange]="restructuring[4] == 'orange'"
    [class.yellow]="restructuring[4] == 'yellow'"
    [class.grey]="restructuring[4] === 'grey'"
    [class.red]="restructuring[4] == 'red'">{{ restructuring[3] }}</div>

  <div class="restructuring-row__button">
    <button class="btn btn-primary btn-small" (click)="goToDetail()">View</button>
  </div>
</div>
