<div class="notification-row__container {{type}}">
    <div class="notification-row__title">{{ notification?.name }}</div>
    <div class="notification-row__loan">{{ notification?.loanType }}</div>
    <div class="notification-row__time">
        {{ notification?.dateStart }} > {{ notification?.dateEnd }}
        > {{ notification?.dateEnd }}
    </div>
    <div class="notification-row__state">
        <span class="u-uppercase">{{ notification?.state }}</span>
    </div>
    <ul class="notification-row__info">
        <li *ngFor="let info of notification?.infos">
            <div>{{ info?.title }}</div>
            <div class="u-strong">{{ info?.data }}</div>
        </li>
    </ul>
    <div class="notification-row__button" (click)="goToPortfolio(notification)">
        View
    </div>
</div>
