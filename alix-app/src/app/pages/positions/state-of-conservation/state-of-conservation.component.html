<div *ngIf="config" class="container-fluid">
  <section class="page-section bg--dark">
    <div class="row">
      <div class="col-4">
        <app-panel-9 comparisonCriteria="{{config.comparableAssets.comparisonCriteria.value}}" [config]="config.comparableAssets.populations.population1"></app-panel-9>
      </div>
      <div class="col-4">
        <app-panel-9 comparisonCriteria="{{config.comparableAssets.comparisonCriteria.value}}" [config]="config.comparableAssets.populations.population2"></app-panel-9>
      </div>
      <div class="col-4">
        <app-panel-9 comparisonCriteria="{{config.comparableAssets.comparisonCriteria.value}}" [config]="config.comparableAssets.populations.population3"></app-panel-9>
      </div>
    </div>
  </section>

  <section class="page-section bg--light">
    <div class="row">
      <div class="col-12">
        <app-dropdown [config]="getSCTodayPopulationNames()" (callback)="changeSCTodayValue($event)"></app-dropdown>
      </div>
    </div>
    <div class="row">
      <div class="col-4">
        <app-panel-10 [config]="selectedStateOfConservationToday"></app-panel-10>
      </div>
      <div class="col-8">
        <alix-line [series]="numbOfAssetsBySc" [opts]="opts.numbOfAssetsBySc" (chartInit)="onChartInit('numbOfAssetsBySc', $event)"></alix-line>
      </div>
    </div>
  </section>

  <section class="page-section bg--dark">
    <div class="row">
      <div class="col-4">
        <app-slider-range [value]="selectedSOCAllAssetsValues[0]" [steps]="selectedSOCAllAssetsValues[1]" (callback)="changeSOCAllAssetsValue($event)"></app-slider-range>
      </div>
    </div>
    <div class="row">
      <div class="col-4">
        <app-panel-11 title="State Of Conservation All Assets" [config]="selectedSOCAllAssets"></app-panel-11>
      </div>
      <div class="col-8 in-c-state-c-all-assets">
        <div class="gmap">
          <app-report-selector [hasBg]="true"></app-report-selector>
          <agm-map [disableDefaultUI]="false" [latitude]="lat" [longitude]="lng" [zoom]="zoom" [gestureHandling]="'none'" [zoomControl]="false" [streetViewControl]="false">
          <agm-circle *ngFor="let marker of markers" [latitude]="marker.lat" [longitude]="marker.lng" [radius]="radius" [fillColor]="marker.color" [circleDraggable]="false" [editable]="false" fillOpacity="1"></agm-circle>
        </agm-map>
      </div>
      </div>
    </div>
  </section>

  <section class="page-section bg--light">
    <div class="row">
      <div class="col-12">
        <h1 class="section-title">IN Construction Satelite images</h1>
        <!-- #HC -->
      </div>
    </div>
    <div class="row">
      <div class="col-12 in-c-satelite-image">
        <div class="gmap">
          <app-report-selector [hasBg]="true"></app-report-selector>
          <agm-map [disableDefaultUI]="false" [latitude]="lat" [longitude]="lng" [zoom]="zoom" mapTypeId="hybrid" [gestureHandling]="'none'" [zoomControl]="false" [streetViewControl]="false">
            <agm-circle [latitude]="lat" [longitude]="lng" [radius]="radius" [fillColor]="'red'" [circleDraggable]="false" [editable]="false">
            </agm-circle>
          </agm-map>
        </div>
      </div>
    </div>
  </section>

  <section class="page-section bg--dark">
    <div class="row">
      <div class="col-4">
        <app-dropdown [config]="getSCTodayPopulationNames()" (callback)="changeSCPpsmValue($event)"></app-dropdown>
      </div>
    </div>
    <div class="row">
      <div class="col-4">
        <app-panel-12 [config]="selectedStateOfConservationPSM"></app-panel-12>
      </div>
      <div class="col-8">
        <alix-line [series]="priceEvolutionBySc" [opts]="opts.priceEvolutionBySc" (chartInit)="onChartInit('priceEvolutionBySc',$event)"></alix-line>
      </div>
    </div>
  </section>

  <section class="page-section bg--light">
    <div class="row">
      <div class="col-12">
        <h1 class="section-title">SQM Price per State of Conservation bar plot</h1>
        <!-- #HC -->
      </div>
    </div>
    <div class="row">
      <div class="col-4">
        <app-slider-range [value]="selectedSOCAllAssetsValues[0]" [steps]="selectedSOCAllAssetsValues[1]"></app-slider-range>
        <app-dropdown [config]="getSCTodayPopulationNames()"></app-dropdown>
      </div>
    </div>
    <div class="row">
      <alix-scatter [series]="getscpPriceEvo()" [opts]="opts.scpPriceEvo"></alix-scatter>
    </div>
  </section>

  <section class="page-section bg--dark">
    <div class="row">
      <div class="col-4">
        <app-slider-range [value]="2018" [steps]="['2015', '2018']" (callback)="changeImageTransition($event)"></app-slider-range>
      </div>
    </div>
    <div class="row no-gutters">
      <div class="col-12">
        <!-- #HC #Missing [steps]-->
        <app-panel-13 [imagesObj]="imageTransitionObject" [config]="imageTransitionValue"></app-panel-13>
      </div>
    </div>
  </section>
</div>
