<div *ngIf="config" class="container-fluid">

  <section class="page-section bg--dark">
    <div class="row">
      <div class="col-4">
          <app-panel-14 [config]="config.demandAndOffer.replacementIndicators"></app-panel-14>
      </div>
      <div class="col-8">
          <alix-line [series]="series.marketValue" [opts]="opts.marketValue"></alix-line>
      </div>
    </div>
  </section>

  <section class="page-section bg--light">
    <div class="row">
    <div class="col-12">
      <h1 class="section-title">Transaction Speed</h1>
    </div>
    <div class="col-3">
        <app-slider-range [value]="2018" [steps]="[2015,2016,2017,2018]"></app-slider-range>
    </div>
  </div>
  </section>

  <section class="page-section bg--dark">
		<div class="row">
			<div class="col">
				<div>
					<alix-scatter [series]="assetDemand.sqm.series" [opts]="assetDemand.sqm.opts"></alix-scatter>
				</div>
			</div>
			<div class="col">
				<div>
					<alix-scatter [series]="assetDemand.rooms.series" [opts]="assetDemand.rooms.opts"></alix-scatter>
				</div>
			</div>
		</div>
	</section>

	<section class="page-section bg--light">
		<div class="row">
			<div class="col-4">
				<app-panel-15 [config]="config"></app-panel-15>
			</div>
			<div class="col-8">
        <app-dropdown [config]="getPriceTodayVsOvertime()" (callback)="changePriceTodayVsOvertime($event)"></app-dropdown>
        <alix-line [series]="series.priceTodayVsOvertime" [opts]="opts.priceTodayVsOvertime" (chartInit)="onChartInit('priceTodayVsOvertime',$event)"></alix-line>
			</div>
		</div>
	</section>

	<section class="page-section bg--dark">
		<div class="row">
			<div class="col-4">
				<app-panel-16 [config]="config.demandAndOffer.forSale.populations"></app-panel-16>
			</div>
			<div class="col-8">
        <alix-line [series]="series.peerListedAssets5YForSale" [opts]="opts.peerListedAssets5YForSale"></alix-line>
			</div>
		</div>
	</section>

	<section class="page-section bg--light">
		<div class="row">
			<div class="col-4">
        <app-dropdown [config]="getPopulationNames()" (callback)="changePopulationForSaleValue($event)"></app-dropdown>
        <app-panel-17 [config]="populationForSale"></app-panel-17>
			</div>
			<div class="col-8">
				<alix-area-stack></alix-area-stack>
			</div>
		</div>
	</section>

	<section class="page-section bg--dark">
		<div class="row">
			<div class="col-4">
				<app-panel-18 [config]="config.demandAndOffer.longRent.populations"></app-panel-18>
			</div>
			<div class="col-8">
				<app-dropdown [config]="getPopulationNames()" (callback)="changelongTermRentEvolutionEurSqmValue($event)"></app-dropdown>
				<alix-line [series]="series.longTermRentEvolutionEurSqm" [opts]="opts.longTermRentEvolutionEurSqm" (chartInit)="onChartInit('longTermRentEvolutionEurSqm',$event)"></alix-line>
			</div>
		</div>
	</section>

	<section class="page-section bg--light">
		<div class="row">
			<div class="col-4">
				<app-panel-19 [config]="config.demandAndOffer.longRent.populations"></app-panel-19>
			</div>
			<div class="col-8">
				<alix-area-basic [series]="series.peerListedAssets5YLr" [opts]="opts.peerListedAssets5YLr"></alix-area-basic>
			</div>
		</div>
	</section>

	<section class="page-section bg--dark">
		<div class="row">
      <div class="col-4">
        <app-dropdown [config]="getPopulationNames()" (callback)="changePopulationLongRentValue($event)"></app-dropdown>
        <app-panel-20 [config]="populationLongRent"></app-panel-20>
      </div>
      <div class="col-8">
        <alix-area-stack></alix-area-stack>
      </div>
		</div>
	</section>

	<section class="page-section bg--light">
		<div class="row">
			<div class="col-4">
				<app-panel-21 [config]="config.demandAndOffer.shortRent.populations"></app-panel-21>
			</div>
			<div class="col-8">
				<alix-line [series]="" [opts]=""></alix-line>
			</div>
		</div>
	</section>

	<section class="page-section bg--dark">
		<div class="row">
			<div class="col-4">
				<app-panel-22 [config]="config.demandAndOffer.shortRent.populations"></app-panel-22>
			</div>
			<div class="col-8">
				<alix-area-basic [series]="series.peerListedAssets5YSr" [opts]="opts.peerListedAssets5YSr"></alix-area-basic>
			</div>
		</div>
	</section>

	<section class="page-section bg--light">
		<div class="row">
			<div class="col-4">
        <app-dropdown [config]="getPopulationNames()" (callback)="changePopulationShortRentValue($event)"></app-dropdown>
        <app-panel-23 [config]="populationShortRent"></app-panel-23>
			</div>
			<div class="col-8">
				<alix-area-stack></alix-area-stack>
			</div>
		</div>
	</section>

	<section class="page-section bg--dark">
		<div class="row">
			<div class="col-4">
        <app-dropdown [config]="getPopulationNames()" (callback)="changePopulationShortRentDemandValue($event)"></app-dropdown>
        <app-panel-24 [config]="populationShortRentDemand"></app-panel-24>
			</div>
			<div class="col-8">
				<alix-area-stack></alix-area-stack>
			</div>
		</div>
	</section>
</div>
