<div *ngIf="config" class="container-fluid">

  <div class="row">
    <div class="col-4">
        <app-panel-13 [config]="config"></app-panel-13>
    </div>
    <div class="col-8">
        <alix-line></alix-line>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
        <h2>Transaction Speed</h2>
    </div>
    <div class="col-3">
        <app-slider-range></app-slider-range>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <h2># SQM / Asset Demand</h2>
      <div><alix-scatter></alix-scatter></div>
    </div>
    <div class="col">
      <h2># Rooms / Asset Demand</h2>
      <div>
        <alix-scatter></alix-scatter>
      </div>
    </div>
  </div>
</div>
